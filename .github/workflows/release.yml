name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: ai-central-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize version tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate release state
        run: ./scripts/check-release.sh

      - name: Ensure annotated version tag
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n '1p' version.txt)
          tag="v$version"
          version_commit=$(git log -1 --format=%H -- version.txt)

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git cat-file -t "$tag")" != "tag" ]; then
              echo "$tag exists but is not an annotated tag"
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$tag")" != "$version_commit" ]; then
              echo "$tag does not point to the commit that introduced version $version"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$version_commit" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release_needed=false" >>"$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install pinned Agent Package Manager
        if: steps.release_state.outputs.release_needed == 'true'
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.29.0'

      - name: Smoke test the remote release tag
        if: steps.release_state.outputs.release_needed == 'true'
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_state.outputs.tag }}
        run: |
          smoke_dir=$(mktemp -d "${RUNNER_TEMP}/ai-central-release.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT HUP INT TERM
          cd "$smoke_dir"
          apm install "$RELEASE_REPOSITORY/packages/apm/core#$RELEASE_TAG" \
            --target agent-skills --no-policy
          apm install --frozen --no-policy
          apm audit --ci --no-cache --no-policy
          test -f .agents/skills/context-engineering/SKILL.md

      - name: Create GitHub release
        if: steps.release_state.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_state.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes

  propose:
    name: Update release pull request
    needs: finalize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Ensure release labels
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "release:major-approved" \
            --color B60205 \
            --description "Explicit maintainer approval for a major release" \
            --force
          gh label create "release:manual" \
            --color FBCA04 \
            --description "Allow a maintainer-authored release version change" \
            --force

      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
