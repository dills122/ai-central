name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check-pr-title.sh "$PR_TITLE" "$PR_LABELS"

      - name: Check release impact classification
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-release-impact.sh "$BASE_SHA" "$PR_TITLE"

      - name: Run local checks
        run: ./scripts/check.sh

      - name: Check release change policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check-release.sh --base-ref "$BASE_SHA" --labels "$PR_LABELS"

      - name: Install pinned Agent Package Manager
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.29.0'

      - name: Run APM package integration checks
        run: ./scripts/check-apm.sh

      - name: Validate catalog JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('templates/catalog.json', 'utf8')); console.log('catalog ok')"

      - name: Ensure external clones are not tracked
        run: |
          if git ls-files external | grep -q .; then
            echo "external/ is for local review clones and must not be tracked"
            git ls-files external
            exit 1
          fi

      - name: Check imported source attribution
        run: |
          missing=0
          for source in \
            agent-skills \
            planning-with-files \
            rust-agentic-skills \
            pm-skills \
            claude-skills \
            antfu-skills \
            web-quality-skills \
            terraform-skill \
            agent-toolkit
          do
            if [ ! -f "templates/skills/imported/licenses/${source}-LICENSE" ]; then
              echo "missing license copy for ${source}"
              missing=1
            fi
          done
          exit "$missing"
